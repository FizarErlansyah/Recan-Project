pre-commit:
  parallel: true # Menjalankan perintah di bawah ini secara bersamaan
  commands:
    formatting:
      glob: "*.dart"
      run: dart format --set-exit-if-changed {staged_files}
    linter:
      glob: "*.dart"
      run: flutter analyze
    anti-slop:
      run: aislop scan
